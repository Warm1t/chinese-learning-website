  <head>

      <style>
          /* Reset et base */
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
              line-height: 1.6;
              color: #333;
              background: #f8f9fa;
              padding: 1rem;
          }

          /* Conteneur principal */
          .container {
              max-width: 500px;
              margin: 0 auto;
              background: white;
              border-radius: 16px;
              box-shadow: 0 4px 20px rgba(0,0,0,0.1);
              overflow: hidden;
          }

          /* Header */
          .header {
              background: linear-gradient(135deg, #ff6b6b, #ff5252);
              color: white;
              text-align: center;
              padding: 2rem 1.5rem;
          }
          .header h1 {
              font-size: 1.8rem;
              margin-bottom: 0.5rem;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
          }
          .header p {
              opacity: 0.9;
              font-size: 0.9rem;
          }

          /* Card principale */
          .card {
              text-align: center;
              padding: 2.5rem 2rem;
              border-bottom: 1px solid #eee;
              position: relative;
          }

          /* Affichage des mots */
          .french-word {
              font-size: 2.2rem;
              font-weight: 600;
              color: #2c3e50;
              margin-bottom: 1.5rem;
              min-height: 50px;
              display: flex;
              align-items: center;
              justify-content: center;
          }

          .chinese-word {
              font-size: 3.8rem;
              font-weight: 700;
              color: #e74c3c;
              margin-bottom: 0.5rem;
              font-family: 'Noto Sans SC', 'Source Han Sans CN', sans-serif;
              min-height: 80px;
              display: flex;
              align-items: center;
              justify-content: center;
              opacity: 0;
              transition: opacity 0.4s ease;
          }
          .chinese-word.visible { opacity: 1; }

          .pinyin {
              font-size: 1.4rem;
              color: #7f8c8d;
              font-style: italic;
              margin-bottom: 1.5rem;
              letter-spacing: 0.05em;
              opacity: 0;
              transition: opacity 0.4s ease;
          }
          .pinyin.visible { opacity: 1; }

          /* Indication des tons (visuel utile pour l'apprentissage) */
          .tones {
              display: flex;
              justify-content: center;
              gap: 0.3rem;
              margin-bottom: 1.5rem;
              font-size: 1.3rem;
          }
          .tone-mark {
              width: 1.2rem;
              height: 1.2rem;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 600;
              color: white;
          }
          .tone-1 { background: #4cc9f0; } /* 1ère tone: haut et plat */
          .tone-2 { background: #f72585; } /* 2ème tone: montante */
          .tone-3 { background: #4cc9f0; } /* 3ème tone: basse puis montante */
          .tone-4 { background: #f72585; } /* 4ème tone: descendante */
          .tone-0 { background: #6c757d; } /* ton neutre */

          /* Légende des tons */
          .tones-legend {
              font-size: 0.8rem;
              color: #6c757d;
              margin-top: 0.5rem;
              display: flex;
              gap: 0.5rem;
              justify-content: center;
              flex-wrap: wrap;
          }
          .tones-legend span {
              display: flex;
              align-items: center;
              gap: 0.2rem;
              font-size: 0.75rem;
          }

          /* Boutons de contrôle */
          .controls {
              display: flex;
              gap: 0.75rem;
              justify-content: center;
              flex-wrap: wrap;
              margin-top: 2rem;
          }
          .btn {
              flex: 1 1 120px;
              min-width: 80px;
              padding: 0.75rem 1rem;
              border: none;
              border-radius: 12px;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.2s ease;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
              font-size: 0.9rem;
          }
          .btn-primary {
              background: linear-gradient(to right, #ff6b6b, #ff5252);
              color: white;
              box-shadow: 0 4px 12px rgba(255,107,107,0.3);
          }
          .btn-primary:hover {
              transform: translateY(-2px);
              box-shadow: 0 6px 16px rgba(255,107,107,0.4);
          }
          .btn-secondary {
              background: #6c757d;
              color: white;
          }
          .btn-secondary:hover {
              background: #5a6268;
              transform: translateY(-2px);
          }
          .btn:active {
              transform: translateY(0);
          }

          /* Indicateur de progrès */
          .progress {
              text-align: center;
              margin: 2rem 0;
              color: #6c757d;
          }
          .progress-bar {
              height: 8px;
              background: #e9ecef;
              border-radius: 4px;
              overflow: hidden;
              margin: 0.5rem 0;
          }
          .progress-fill {
              height: 100%;
              background: linear-gradient(to right, #ff6b6b, #4cc9f0);
              width: 0%;
              transition: width 0.3s ease;
          }

          /* Statistiques */
          .stats {
              display: flex;
              justify-content: space-around;
              padding: 1.5rem;
              background: #f8f9fa;
              border-top: 1px solid #eee;
              font-size: 0.9rem;
          }
          .stat {
              text-align: center;
          }
          .stat-value {
              font-size: 1.5rem;
              font-weight: 600;
              color: #2c3e50;
              display: block;
          }
          .stat-label {
              color: #6c757d;
              font-size: 0.85rem;
          }

          /* Footer */
          .footer {
              text-align: center;
              padding: 1.5rem;
              color: #6c757d;
              font-size: 0.85rem;
              border-top: 1px solid #eee;
          }

          /* Responsive */
          @media (max-width: 480px) {
              .header h1 { font-size: 1.5rem; }
              .card { padding: 2rem 1.5rem; }
              .french-word { font-size: 1.8rem; }
              .chinese-word { font-size: 3.2rem; }
              .controls { flex-direction: column; }
              .btn { width: 100%; margin-bottom: 0.5rem; }
          }

          /* Utilitaires */
          .hidden { display: none; }
          .visually-hidden {
              position: absolute;
              width: 1px;
              height: 1px;
              padding: 0;
              margin: -1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
              border: 0;
          }
      </style>

          ].slice(0, 150); // Garder exactement 150 mots pour HSK 1

          // ======================
          // LOGIQUE DE L'APPLICATION
          // ======================
          let currentIndex = 0;
          let correctAnswers = 0;
          let wrongAnswers = 0;
          let currentStreak = 0;
          let isShowingAnswer = false;

          // Éléments DOM
          const frenchWordEl = document.getElementById('frenchWord');
          const chineseWordEl = document.getElementById('chineseWord');
          const pinyinEl = document.getElementById('pinyin');
          const tonesEl = document.getElementById('tones');
          const tonesLegendEl = document.getElementById('tonesLegend');
          const showAnswerBtn = document.getElementById('showAnswer');
          const nextWordBtn = document.getElementById('nextWord');
          const pronounceBtn = document.getElementById('pronounce');
          const counterEl = document.getElementById('counter');
          const progressFillEl = document.getElementById('progressFill');
          const correctCountEl = document.getElementById('correctCount');
          const wrongCountEl = document.getElementById('wrongCount');
          const streakEl = document.getElementById('streak');

          // Initialiser l'application
          function initApp() {
              loadStats();
              updateDisplay();
              updateTonesIndicators();
              updateProgress();
              announceToScreenReader(`Application prête. Mot actuel: ${vocabulary[currentIndex].french}`);
          }

          // Mettre à jour l'affichage du mot actuel
          function updateDisplay() {
              const word = vocabulary[currentIndex];

              frenchWordEl.textContent = word.french;
              chineseWordEl.textContent = word.chinese;
              pinyinEl.textContent = word.pinyin;

              // Réinitialiser l'état
              chineseWordEl.classList.remove('visible');
              pinyinEl.classList.remove('visible');
              isShowingAnswer = false;
              showAnswerBtn.textContent = 'Voir la réponse';
              showAnswerBtn.disabled = false;

              // Mettre à jour les indicateurs de tons
              updateTonesIndicators();

              // Mettre à jour le compteur et la barre de progrès
              counterEl.textContent = `Mot ${currentIndex + 1}/${vocabulary.length}`;
              const progressPercent = ((currentIndex + 1) / vocabulary.length) * 100;
              progressFillEl.style.width = progressPercent + '%';
          }

          // Mettre à jour les indicateurs visuels des tons
          function updateTonesIndicators() {
              const word = vocabulary[currentIndex];
              tonesEl.innerHTML = '';
              tonesLegendEl.innerHTML = '';

              if (!word || !word.tones) return;

              // Créer les marqueurs de ton visuels
              word.tones.forEach((tone, index) => {
                  const toneDiv = document.createElement('div');
                  toneDiv.className = `tone-mark tone-${tone}`;

                  // Ajouter une description pour l'accessibilité
                  const toneDescriptions = {
                      0: 'ton neutre',
                      1: 'première tone (haute et plate)',
                      2: 'deuxième tone (montante)',
                      3: 'troisième tone (descendante puis montante)',
                      4: 'quatrième tone (descendante)'
                  };
                  toneDiv.setAttribute('aria-label', toneDescriptions[tone] || `tone ${tone}`);

                  tonesEl.appendChild(toneDiv);
              });

              // Créer la légende des tons
              const toneLabels = [
                  { label: '1ʳᵉ tone', desc: 'haute et plate', className: 'tone-1' },
                  { label: '2ᵉ tone', desc: 'montante', className: 'tone-2' },
                  { label: '3ᵉ tone', desc: 'basse puis montante', className: 'tone-3' },
                  { label: '4ᵉ tone', desc: 'descendante', className: 'tone-4' },
                  { label: 'ton neutre', desc: 'léger et bref', className: 'tone-0' }
              ];

              toneLabels.forEach(tone => {
                  const span = document.createElement('span');
                  span.innerHTML = `
                      <div class="tone-mark ${tone.className}" aria-hidden="true"></div>
                      <span>${tone.label}: ${tone.desc}</span>
                  `;
                  tonesLegendEl.appendChild(span);
              });
          }

          // Montrer ou cacher la réponse
          function toggleAnswer() {
              if (!isShowingAnswer) {
                  chineseWordEl.classList.add('visible');
                  pinyinEl.classList.add('visible');
                  isShowingAnswer = true;
                  showAnswerBtn.textContent = 'Cacher la réponse';
                  announceToScreenReader(`Réponse: ${vocabulary[currentIndex].chinese}, pinyin: ${vocabulary[currentIndex].pinyin}`);
              } else {
                  chineseWordEl.classList.remove('visible');
                  pinyinEl.classList.remove('visible');
                  isShowingAnswer = false;
                  showAnswerBtn.textContent = 'Voir la réponse';
                  announceToScreenReader(`Mot français: ${vocabulary[currentIndex].french}. Appuyez sur Entrée pour voir la réponse.`);
              }
          }

          // Passer au mot suivant et mettre à jour les statistiques
          function nextWord() {
              const word = vocabulary[currentIndex];

              // Mettre à jour les statistiques selon l'état actuel
              if (isShowingAnswer) {
                  // L'utilisateur a vu la réponse avant de passer = considéré comme correct
                  correctAnswers++;
                  currentStreak++;
              } else {
                  // L'utilisateur est passé sans voir la réponse = considéré comme erreur
                  wrongAnswers++;
                  currentStreak = 0; // Réinitialiser la série en cas d'erreur
              }

              // Sauvegarder les statistiques
              saveStats();

              // Passer au mot suivant (boucle circulaire)
              currentIndex = (currentIndex + 1) % vocabulary.length;

              // Mettre à jour l'affichage
              updateDisplay();
              updateStatsDisplay();

              // Annoncer pour l'accessibilité
              announceToScreenReader(`Nouveau mot: ${vocabulary[currentIndex].french}. Appuyez sur Entrée pour voir la réponse.`);
          }

          // Prononcer le mot actuel (avec fallback)
          function pronounceWord() {
              const word = vocabulary[currentIndex];

              // Vérifier si la synthèse vocale est disponible
              if ('speechSynthesis' in window) {
                  // Annuler toute prononciation en cours
                  window.speechSynthesis.cancel();

                  const utterance = new SpeechSynthesisUtterance(word.pinyin);
                  utterance.lang = 'zh-CN';
                  utterance.rate = 0.8; // Légèrement plus lent pour une meilleure compréhension
                  utterance.pitch = 1.2;

                  window.speechSynthesis.speak(utterance);
                  announceToScreenReader(`Prononciation: ${word.pinyin}`);
              } else {
                  // Fallback : afficher l'alerte avec le pinyin
                  alert(`Prononciation du mot "${word.french}" :\n${word.pinyin}\n\n(NOTE: La synthèse vocale n'est pas disponible dans ce navigateur. Pour
  une meilleure expérience, utilisez Chrome, Edge ou Safari.)`);
              }
          }

          // Mettre à jour l'affichage des statistiques
          function updateStatsDisplay() {
              correctCountEl.textContent = correctAnswers;
              wrongCountEl.textContent = wrongAnswers;
              streakEl.textContent = currentStreak;
          }

          // Sauvegarder les statistiques dans localStorage
          function saveStats() {
              const stats = {
                  correctAnswers: correctAnswers,
                  wrongAnswers: wrongAnswers,
                  currentStreak: currentStreak,
                  lastStudyDate: new Date().toISOString().split('T')[0]
              };
              localStorage.setItem('chineseLearningStats', JSON.stringify(stats));
          }

          // Charger les statistiques depuis localStorage
          function loadStats() {
              const stats = localStorage.getItem('chineseLearningStats');
              if (stats) {
                  try {
                      const parsed = JSON.parse(stats);
                      correctAnswers = parsed.correctAnswers || 0;
                      wrongAnswers = parsed.wrongAnswers || 0;
                      currentStreak = parsed.currentStreak || 0;
                  } catch (e) {
                      console.warn('Impossible de charger les statistiques:', e);
                      // Réinitialiser en cas de corruption
                      correctAnswers = 0;
                      wrongAnswers = 0;
                      currentStreak = 0;
                  }
              }
          }

          // Réinitialiser les statistiques
          function resetStats() {
              if (window.confirm('Êtes-vous sûr de vouloir réinitialiser toutes vos statistiques? Cette action est irréversible.')) {
                  correctAnswers = 0;
                  wrongAnswers = 0;
                  currentStreak = 0;
                  saveStats();
                  updateStatsDisplay();
                  announceToScreenReader('Statistiques réinitialisées');
              }
          }

          // Annoncer aux lecteurs d'écran
          function announceToScreenReader(message) {
              // Créer un élément temporaire pour l'annonce
              const announcement = document.createElement('div');
              announcement.setAttribute('aria-live', 'polite');
              announcement.setAttribute('class', 'visually-hidden');
              announcement.textContent = message;
              document.body.appendChild(announcement);

              // Nettoyer après annonce
              setTimeout(() => {
                  announcement.remove();
              }, 3000);
          }

          // Gestion des événements
          showAnswerBtn.addEventListener('click', toggleAnswer);
          nextWordBtn.addEventListener('click', nextWord);
          pronounceBtn.addEventListener('click', pronounceWord);

          // Gestion du clavier
          document.addEventListener('keydown', (e) => {
              // Ignorer si l'utilisateur est en train de taper dans un champ de saisie
              if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

              switch(e.key) {
                  case 'Enter':
                      if (isShowingAnswer) {
                          nextWord();
                      } else {
                          toggleAnswer();
                      }
                      break;
                  case 'ArrowRight':
                      nextWord();
                      break;
                  case 'ArrowLeft':
                      // Aller en arrière seulement si on voit la réponse (pour éviter de perdre sa place)
                      if (isShowingAnswer) {
                          currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
                          updateDisplay();
                          updateStatsDisplay();
                          announceToScreenReader(`Mot précédent: ${vocabulary[currentIndex].french}. Appuyez sur Entrée pour voir la réponse.`);
                      }
                      break;
                  case ' ':
                      // Espace pour jouer/arrêter l'audio
                      pronounceWord();
                      break;
              }
          });

          // Gestion du bouton de réinitialisation des stats
          document.getElementById('resetStats').addEventListener('click', function(e) {
              e.preventDefault();
              resetStats();
          });

          // Initialiser l'application quand le DOM est prêt
          if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', initApp);
          } else {
              initApp();
          }
